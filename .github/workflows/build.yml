name: Build and check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm exec --prefix apps/HUSDiagnostic -- tsc -p apps/HUSDiagnostic/tsconfig.json
      - run: npm exec --prefix apps/PHVD -- tsc -p apps/PHVD/tsconfig.json
      - run: node apps/PHVD/scripts/test-accuracy.mjs
      - run: node apps/PHVD/scripts/test-risk.mjs
      - run: node apps/PHVD/scripts/test-history.mjs
      - run: node apps/PHVD/scripts/test-scan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: drive-ivh-web
          path: dist


      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
